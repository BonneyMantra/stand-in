[package]
name = "standin-guardian"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "~5.17"

[dev-dependencies]
near-sdk = { version = "~5.17", features = ["unit-testing"] }

[dev-dependencies.near-workspaces]
version = "0.22"

[dev-dependencies.tokio]
version = "1"
features = ["full"]

[dev-dependencies.serde_json]
version = "1"

[dev-dependencies.anyhow]
version = "1"

[dev-dependencies.ed25519-dalek]
version = "2"

[dev-dependencies.bs58]
version = "0.5"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = "symbols"



